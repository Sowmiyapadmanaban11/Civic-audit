<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Browse Projects — CivicAudit</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/projects.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>

  <div class="main-col">
    <div id="topbar-mount"></div>

    <div class="page-body">
      <div class="filter-bar">
        <select id="filter-type" class="filter-select">
          <option value="">All Types</option>
          <option>Construction</option>
          <option>Renovation</option>
          <option>Demolition</option>
          <option>Land Development</option>
          <option>Interior Design</option>
          <option>Property Sale</option>
          <option>Other</option>
        </select>
        <select id="filter-budget" class="filter-select">
          <option value="">Any Budget</option>
          <option value="under-10L">Under ₹10L</option>
          <option value="10L-50L">₹10L – ₹50L</option>
          <option value="above-50L">Above ₹50L</option>
        </select>
        <input type="text" id="filter-location" class="filter-select" placeholder="Filter by location…" />
      </div>

      <div class="project-grid" id="projects-grid">
        <div class="loading-row" style="grid-column:1/-1;"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/ai.js"></script>
<script src="js/projects.js"></script>
</body>
</html>
